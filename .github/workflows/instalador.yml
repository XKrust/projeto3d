# Monta o instalador do Windows e testa de verdade: instala, abre, confere as telas e a API,
# desliga e desinstala. Em tag v* (ex.: v1.0.0) publica o instalador numa Release.
name: Instalador Windows

on:
  push:
    tags: ["v*"]
    branches: ["**", "!versao/**"]
    paths:
      - "backend/**"
      - "ferramentas-dev/**"
      - "frontend/**"
      - "installer/**"
      - ".github/workflows/instalador.yml"
  workflow_dispatch:
  # Chamado por publicar.yml (push em versao/X.Y.Z): monta, testa e publica a versão X.Y.Z.
  workflow_call:
    inputs:
      versao:
        type: string
        required: true

permissions:
  contents: write

# Um teste novo no mesmo branch cancela o anterior.
concurrency:
  group: instalador-${{ github.ref }}
  cancel-in-progress: true

jobs:
  instalador:
    runs-on: windows-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Versão
        id: versao
        shell: pwsh
        run: |
          # versao/X.Y.Z ou tag vX.Y.Z: versão exata. Push na main: VERSAO (ex. 1.0) + próximo
          # número livre (1.0.0, 1.0.1…), publicada automaticamente. Outros branches: só testa.
          $base = (Get-Content installer\VERSAO -Raw).Trim()
          $main = "${{ github.ref }}" -eq "refs/heads/main" -and -not "${{ inputs.versao }}"
          if ("${{ inputs.versao }}") { $v = "${{ inputs.versao }}" -replace '^versao/', '' -replace '^v', '' }
          elseif ("${{ github.ref_type }}" -eq "tag") { $v = "${{ github.ref_name }}".TrimStart("v") }
          elseif ($main) {
            # Próximo número depois da maior tag vBASE.N publicada (primeira: BASE.0). @() e
            # .Count: uma única tag v1.0.0 dá o número 0, que o "if" do PowerShell lê como falso.
            $ns = @(git ls-remote --tags origin "refs/tags/v$base.*" | ForEach-Object {
              if ($_ -match "refs/tags/v$([regex]::Escape($base))\.(\d+)$") { [int]$Matches[1] } })
            $n = if ($ns.Count -gt 0) { ($ns | Measure-Object -Maximum).Maximum + 1 } else { 0 }
            $v = "$base.$n"
          }
          else { $v = "0.0.0-dev." + "${{ github.run_number }}" }
          "valor=$v" >> $env:GITHUB_OUTPUT
          if ($v -notmatch '^\d+\.\d+\.\d+$' -and "${{ inputs.versao }}") { throw "Versão inválida: $v (use versao/1.2.3)" }
          $publicar = ("${{ inputs.versao }}" -ne "") -or ("${{ github.ref_type }}" -eq "tag") -or $main
          "publicar=$($publicar.ToString().ToLower())" >> $env:GITHUB_OUTPUT

      - name: Dependências do frontend
        working-directory: frontend
        run: npm ci

      - name: Montar dist\Radar3D
        shell: pwsh
        run: ./installer/montar.ps1 -Versao "${{ steps.versao.outputs.valor }}"

      - name: Inno Setup
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress; }
          & $iscc "/DAppVersion=${{ steps.versao.outputs.valor }}" installer\radar3d.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC falhou" }

      # O Windows 10/11 de quem instala já traz o WebView2 Runtime (motor da janela do app); o
      # Windows Server do robô pode não trazer. Sem ele o app cairia no navegador e o teste da
      # janela reprovaria.
      - name: WebView2 Runtime no robô
        timeout-minutes: 8
        shell: pwsh
        run: |
          $chave = "SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}"
          function Versao { foreach ($k in "HKLM:\$chave", "HKCU:\$($chave -replace 'WOW6432Node\\', '')") {
              $v = (Get-ItemProperty $k -ErrorAction SilentlyContinue).pv
              if ($v -and $v -ne "0.0.0.0") { return $v } } }
          $v = Versao
          if ($v) { Write-Host "::notice::WebView2 Runtime já instalado no robô: $v"; exit 0 }
          Invoke-WebRequest "https://go.microsoft.com/fwlink/p/?LinkId=2124703" -OutFile "$env:RUNNER_TEMP\wv2setup.exe"
          Start-Process "$env:RUNNER_TEMP\wv2setup.exe" -ArgumentList "/silent", "/install" -Wait
          $v = Versao
          if (-not $v) { throw "Não consegui instalar o WebView2 Runtime no robô" }
          Write-Host "::notice::WebView2 Runtime instalado no robô: $v"

      - name: Teste - instalar
        timeout-minutes: 5
        shell: pwsh
        run: |
          $setup = Get-ChildItem dist\Radar3D-Setup-*.exe | Select-Object -First 1
          Start-Process $setup.FullName -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/TASKS=desktopicon" -Wait
          $app = "$env:LOCALAPPDATA\Programs\Radar3D"
          foreach ($f in "Radar3D.exe", "Parar.cmd", "runtime\node.exe", "runtime\uv.exe", "frontend\server.js", "backend\app\main.py", "VERSION",
                         "Microsoft.Web.WebView2.Core.dll", "Microsoft.Web.WebView2.WinForms.dll", "runtimes\win-x64\native\WebView2Loader.dll") {
            if (-not (Test-Path "$app\$f")) { throw "Faltou $f na instalação" }
          }
          foreach ($lnk in "Radar 3D.lnk", "Fechar o Radar 3D.lnk") {
            if (-not (Test-Path "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\$lnk")) { throw "Atalho $lnk não criado" }
          }

      - name: Teste - abrir na própria janela, sem cmd
        timeout-minutes: 12
        shell: pwsh
        run: |
          $env:RADAR_NO_BROWSER = "1"
          $app = "$env:LOCALAPPDATA\Programs\Radar3D"
          $log = "$env:LOCALAPPDATA\Radar3D\data\lancador.log"
          Start-Process "$app\Radar3D.exe"
          $t = [Diagnostics.Stopwatch]::StartNew()
          $pronto = $false
          while ($t.Elapsed.TotalMinutes -lt 10) {
            try { if ((Invoke-WebRequest "http://127.0.0.1:3000/api/health" -UseBasicParsing -TimeoutSec 5).StatusCode -eq 200) { $pronto = $true; break } } catch {}
            if (-not (Get-Process Radar3D -ErrorAction SilentlyContinue)) { throw "O lançador fechou antes de ficar pronto" }
            Start-Sleep 3
          }
          if (-not $pronto) { throw "Não ficou pronto em 10 minutos" }
          Write-Host "::notice::Primeira abertura pronta em $([int]$t.Elapsed.TotalSeconds) s (inclui baixar o Python)"
          # A janela do app (WebView2) carregou a tela de verdade: o lançador grava no log.
          $janela = $null
          $t2 = [Diagnostics.Stopwatch]::StartNew()
          while ($t2.Elapsed.TotalSeconds -lt 90) {
            if (Test-Path $log) {
              $janela = Select-String -Path $log -Pattern "janela carregou" | Select-Object -Last 1
              if ($janela) { break }
              $sem = Select-String -Path $log -Pattern "Sem a janela própria" | Select-Object -Last 1
              if ($sem) { throw "Não abriu a janela própria: $($sem.Line)" }
            }
            Start-Sleep 1
          }
          if (-not $janela) { throw "A janela do app não carregou a tela em 90 s. Log: $(if (Test-Path $log) { Get-Content $log -Raw })" }
          $chars = [int]([regex]::Match($janela.Line, '\((\d+) caracteres').Groups[1].Value)
          if ($chars -lt 50) { throw "A janela abriu vazia: $($janela.Line)" }
          $lancadorProc = Get-Process Radar3D
          if ($lancadorProc.MainWindowTitle -ne "Radar 3D") { throw "Janela do app não está visível (título: '$($lancadorProc.MainWindowTitle)')" }
          Write-Host "::notice::$($janela.Line) — $([int]$t2.Elapsed.TotalSeconds) s depois de pronto"
          Select-String -Path $log -Pattern "^erro|^janela:" | ForEach-Object { Write-Host "::warning::lancador.log: $($_.Line)" }
          # Fora a janela do app, nenhum processo pode ter janela (nada de cmd preto na tela).
          # Os do WebView2 (msedgewebview2) desenham dentro da janela do app.
          $lancador = $lancadorProc.Id
          $todos = Get-CimInstance Win32_Process
          $filhos = @($lancador); $novos = @($lancador)
          while ($novos.Count) { $novos = @($todos | Where-Object { $novos -contains $_.ParentProcessId } | ForEach-Object ProcessId); $filhos += $novos }
          $nomes = @()
          foreach ($id in ($filhos | Where-Object { $_ -ne $lancador })) {
            $p = Get-Process -Id $id -ErrorAction SilentlyContinue
            if (-not $p) { continue }
            $nomes += $p.ProcessName
            if ($p.ProcessName -eq "cmd") { throw "O lançador abriu um cmd" }
            if ($p.ProcessName -ne "msedgewebview2" -and $p.MainWindowHandle -ne 0) { throw "Janela visível: $($p.ProcessName)" }
          }
          Write-Host "::notice::Processos do Radar 3D (só a janela do app aparece): $(($nomes | Sort-Object -Unique) -join ', ')"
          $ok = @(
            "http://127.0.0.1:8000/api/health", "http://127.0.0.1:3000/", "http://127.0.0.1:3000/radar",
            "http://127.0.0.1:3000/analisar", "http://127.0.0.1:3000/config", "http://127.0.0.1:3000/api/health",
            "http://127.0.0.1:3000/api/radar/meta", "http://127.0.0.1:3000/api/settings", "http://127.0.0.1:3000/api/countries",
            "http://127.0.0.1:3000/favicon.ico"
          )
          foreach ($u in $ok) {
            $r = Invoke-WebRequest $u -UseBasicParsing -TimeoutSec 30
            if ($r.StatusCode -ne 200) { throw "$u respondeu $($r.StatusCode)" }
          }
          $html = (Invoke-WebRequest "http://127.0.0.1:3000/analisar" -UseBasicParsing).Content
          $css = [regex]::Match($html, '/_next/static/[^"]+\.css').Value
          if (-not $css) { throw "CSS não encontrado na página" }
          if ((Invoke-WebRequest "http://127.0.0.1:3000$css" -UseBasicParsing).StatusCode -ne 200) { throw "CSS não carregou" }
          if (-not (Test-Path "$env:LOCALAPPDATA\Radar3D\data\radar.db")) { throw "Banco não foi criado em LOCALAPPDATA" }

      - name: Teste - coleta real sem perder a conexão
        timeout-minutes: 24
        shell: pwsh
        run: |
          # Coleta de verdade (internet real) enquanto a tela consulta a API sem parar, como o
          # navegador faz. Qualquer consulta que falhe reprova. Mede em quanto tempo o radar
          # fica pronto (notas calculadas) — é o que quem instala espera na primeira vez.
          $base = "http://127.0.0.1:3000"
          function Temas { (Invoke-WebRequest "$base/api/radar?country=BR" -UseBasicParsing -TimeoutSec 30).Content | ConvertFrom-Json | Measure-Object | Select-Object -ExpandProperty Count }
          $r = Invoke-RestMethod -Method Post "$base/api/collect"
          Write-Host "::notice::Coletar agora: $($r.message)"
          $t = [Diagnostics.Stopwatch]::StartNew()
          $falhas = 0; $consultas = 0; $viuRodando = $false; $fases = [ordered]@{}; $radarPronto = $null
          while ($t.Elapsed.TotalMinutes -lt 20) {
            foreach ($u in "/api/health", "/api/sources", "/api/radar/meta", "/api/radar?country=BR", "/") {
              $consultas++
              try {
                $resp = Invoke-WebRequest "$base$u" -UseBasicParsing -TimeoutSec 30
                if ($resp.StatusCode -ne 200) { $falhas++; Write-Host "::warning::$u respondeu $($resp.StatusCode)" }
              } catch { $falhas++; Write-Host "::warning::$u falhou: $($_.Exception.Message)" }
            }
            $st = Invoke-RestMethod "$base/api/collect/status"
            if ($st.running) {
              $viuRodando = $true
              if (-not $fases.Contains("$($st.phase)")) { $fases["$($st.phase)"] = [int]$t.Elapsed.TotalSeconds }
            }
            if (-not $radarPronto -and (Temas) -gt 0) { $radarPronto = [int]$t.Elapsed.TotalSeconds }
            if (-not $st.running -and ($viuRodando -or $st.finished_at)) { break }
            # Radar pronto: segue consultando mais 1 minuto (com a concorrência sendo medida em
            # segundo plano) e encerra, para o teste não esperar a contagem de anúncios inteira.
            if ($radarPronto -and ($t.Elapsed.TotalSeconds - $radarPronto) -gt 60) { break }
            Start-Sleep 2
          }
          $fasesTxt = ($fases.GetEnumerator() | ForEach-Object { "$($_.Key) aos $($_.Value) s" }) -join ", "
          Write-Host "::notice::Radar com temas aos $radarPronto s. Fases: $fasesTxt. Total $([int]$t.Elapsed.TotalSeconds) s, $consultas consultas, $falhas falhas."
          $fontes = Invoke-RestMethod "$base/api/sources"
          Write-Host "::notice::Fontes: $(($fontes | ForEach-Object { "$($_.name)=$($_.status)/$($_.items_last_run)" }) -join ', ')"
          Write-Host "::notice::Temas no radar (BR): $(Temas)"
          $log = "$env:LOCALAPPDATA\Radar3D\data\lancador.log"
          if ((Test-Path $log) -and (Select-String -Path $log -Pattern "parou" -Quiet)) { throw "Uma parte do app caiu durante a coleta: $(Get-Content $log -Raw)" }
          if ($falhas -gt 0) { throw "$falhas consultas falharam durante a coleta" }
          if (-not $radarPronto) { throw "O radar não ganhou nenhum tema em 20 minutos" }

      - name: Teste - fechar pelo atalho
        timeout-minutes: 3
        shell: pwsh
        run: |
          $app = "$env:LOCALAPPDATA\Programs\Radar3D"
          $sair = Start-Process "$app\Radar3D.exe" -ArgumentList "--sair" -PassThru
          if (-not $sair.WaitForExit(60000)) { throw "Fechar não terminou em 60 s" }
          Start-Sleep 3
          if (Get-NetTCPConnection -LocalPort 3000, 8000 -State Listen -ErrorAction SilentlyContinue) { throw "Fechar não desligou" }
          if (Get-Process Radar3D -ErrorAction SilentlyContinue) { throw "O lançador continuou aberto" }
          $sobra = Get-CimInstance Win32_Process | Where-Object { $_.ExecutablePath -and ($_.ExecutablePath -like "$app*" -or $_.ExecutablePath -like "$env:LOCALAPPDATA\Radar3D\*") }
          if ($sobra) { throw "Sobraram processos: $(($sobra | ForEach-Object Name) -join ', ')" }
          $webview = Get-CimInstance Win32_Process -Filter "Name='msedgewebview2.exe'" | Where-Object { $_.CommandLine -like "*Radar3D\webview*" }
          if ($webview) { throw "A janela do app deixou $(@($webview).Count) processos do WebView2 abertos" }

      - name: Teste - reabrir rápido e não duplicar
        timeout-minutes: 4
        shell: pwsh
        run: |
          $env:RADAR_NO_BROWSER = "1"
          $app = "$env:LOCALAPPDATA\Programs\Radar3D"
          $log = "$env:LOCALAPPDATA\Radar3D\data\lancador.log"
          function Carregou { @(Select-String -Path $log -Pattern "janela carregou" -ErrorAction SilentlyContinue).Count }
          $antes = Carregou
          $t = [Diagnostics.Stopwatch]::StartNew()
          Start-Process "$app\Radar3D.exe"
          while ($t.Elapsed.TotalSeconds -lt 120) {
            if ((Carregou) -gt $antes) { break }
            Start-Sleep 1
          }
          Write-Host "::notice::Reabriu (janela com a tela carregada) em $([int]$t.Elapsed.TotalSeconds) s"
          if ($t.Elapsed.TotalSeconds -ge 120) { throw "Reabrir demorou demais. Log: $(Get-Content $log -Tail 15 | Out-String)" }
          # Segunda abertura: só traz a janela aberta para a frente e sai. Sem -Wait: no
          # PowerShell 7 ele espera também os processos filhos.
          $segunda = Start-Process "$app\Radar3D.exe" -PassThru
          if (-not $segunda.WaitForExit(30000)) { throw "A segunda abertura não saiu em 30 s" }
          if (@(Get-Process Radar3D -ErrorAction SilentlyContinue).Count -ne 1) { throw "Abriu dois lançadores" }
          if (@(Get-NetTCPConnection -LocalPort 8000 -State Listen).Count -ne 1) { throw "Subiu dois backends" }

      - name: Teste - atualizar por cima com o app aberto
        timeout-minutes: 6
        shell: pwsh
        run: |
          $env:RADAR_NO_BROWSER = "1"
          $app = "$env:LOCALAPPDATA\Programs\Radar3D"
          $setup = Get-ChildItem dist\Radar3D-Setup-*.exe | Select-Object -First 1
          Start-Process $setup.FullName -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART" -Wait
          if (Get-Process Radar3D -ErrorAction SilentlyContinue) { throw "O instalador não fechou o app aberto" }
          $t = [Diagnostics.Stopwatch]::StartNew()
          Start-Process "$app\Radar3D.exe"
          while ($t.Elapsed.TotalSeconds -lt 120) {
            try { if ((Invoke-WebRequest "http://127.0.0.1:3000/api/health" -UseBasicParsing -TimeoutSec 5).StatusCode -eq 200) { break } } catch {}
            Start-Sleep 1
          }
          if ($t.Elapsed.TotalSeconds -ge 120) { throw "Não abriu depois de atualizar" }
          Write-Host "::notice::Atualizou por cima e reabriu em $([int]$t.Elapsed.TotalSeconds) s"

      - name: Teste - desinstalar
        timeout-minutes: 5
        shell: pwsh
        run: |
          $app = "$env:LOCALAPPDATA\Programs\Radar3D"
          # O desinstalador do Inno se copia para a pasta temporária e sai na hora; espera a
          # pasta sumir em vez de esperar o processo.
          & "$app\unins000.exe" /VERYSILENT /SUPPRESSMSGBOXES /NORESTART
          $fim = (Get-Date).AddMinutes(3)
          while ((Test-Path "$app\runtime") -and (Get-Date) -lt $fim) { Start-Sleep 2 }
          if (Test-Path "$app\runtime") { throw "Desinstalar deixou o programa" }
          Start-Sleep 3
          if (Get-NetTCPConnection -LocalPort 3000, 8000 -State Listen -ErrorAction SilentlyContinue) { throw "Desinstalar não desligou" }
          if (Get-Process Radar3D -ErrorAction SilentlyContinue) { throw "Desinstalar deixou o lançador aberto" }
          if (-not (Test-Path "$env:LOCALAPPDATA\Radar3D\data\radar.db")) { throw "Desinstalar apagou os dados" }
          if (Test-Path "$env:LOCALAPPDATA\Radar3D\venv") { throw "Desinstalar deixou o venv" }
          Write-Host "::notice::Desinstalado; dados mantidos"

      - name: Logs em caso de falha
        if: failure()
        shell: pwsh
        run: |
          foreach ($f in "lancador.log", "preparo.log", "backend.log", "frontend.log") {
            $p = "$env:LOCALAPPDATA\Radar3D\data\$f"
            if (Test-Path $p) {
              $txt = (Get-Content $p -Tail 25) -join "%0A"
              Write-Host "::error title=$f::$txt"
            }
          }

      - uses: actions/upload-artifact@v4
        with:
          name: Radar3D-Setup
          path: dist/Radar3D-Setup-*.exe

      - name: Cópia com nome fixo (link de download que não muda)
        if: steps.versao.outputs.publicar == 'true'
        shell: pwsh
        run: Copy-Item (Get-ChildItem dist\Radar3D-Setup-*.exe | Select-Object -First 1).FullName dist\Radar3D-Setup.exe

      - name: Publicar na Release
        if: steps.versao.outputs.publicar == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.versao.outputs.valor }}
          target_commitish: ${{ github.sha }}
          name: Radar 3D ${{ steps.versao.outputs.valor }}
          make_latest: true
          files: |
            dist/Radar3D-Setup-*.exe
            dist/Radar3D-Setup.exe

      # A página inicial do repositório (e o "Download ZIP") traz o instalador testado da
      # última versão publicada. Só roda quando os testes acima passaram.
      - name: Instalador na raiz da main
        if: steps.versao.outputs.publicar == 'true'
        shell: pwsh
        run: |
          $exe = (Resolve-Path dist\Radar3D-Setup.exe).Path
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Tenta 3 vezes: se alguém enviou um commit para a main durante o teste, pega o novo
          # e grava o instalador em cima dele.
          foreach ($tentativa in 1..3) {
            git fetch --depth 1 origin main
            git checkout -B main origin/main
            Copy-Item $exe Radar3D-Setup.exe -Force
            git add Radar3D-Setup.exe
            git commit -m "chore: instalador v${{ steps.versao.outputs.valor }} na raiz"
            git push origin main
            if ($LASTEXITCODE -eq 0) { exit 0 }
            Start-Sleep 5
          }
          throw "Não consegui gravar o instalador na main"
