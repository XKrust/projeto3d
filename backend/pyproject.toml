[project]
name = "radar3d-backend"
version = "0.1.0"
description = "Radar 3D - backend local (FastAPI + SQLModel)"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "sqlmodel",
    "httpx",
    "apscheduler>=3.10,<4",
    "pyyaml",
    "playwright",
    "selectolax",
    "google-genai",
    "defusedxml>=0.7.1",
    "wordfreq>=3.1.1",
]

[dependency-groups]
dev = [
    "pytest",
    "respx",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
pythonpath = ["."]
