# Datas que puxam vendas de modelos 3D, por país. Ver docs/hype-sazonal.md.
#
# idea_sets: conjuntos de ideias de modelo, reutilizados por várias datas.
#   Cada ideia: name (como aparece na tela, PT), query (termo de busca nas lojas, em
#   inglês) e keywords (o que conta como "fala dessa ideia" nos itens coletados; EN, PT e
#   JP quando faz sentido). Keyword é frase específica ("santa claus", "heart shaped"),
#   nunca palavra solta que aparece em qualquer título ("santa", "heart", "星").
#
# events: cada data.
#   countries: códigos (app.constants.COUNTRIES) ou [ALL].
#   rule (uma destas):
#     fixed: "MM-DD"
#     nth_weekday: {month, weekday (0=segunda … 6=domingo), n (1 = primeiro, -1 = último)}
#     easter_offset: dias em relação à Páscoa (0 = domingo de Páscoa)
#     after_nth_weekday: {month, weekday, n, plus_days}  (ex.: Black Friday)
#   ideas: nome de um idea_set.

