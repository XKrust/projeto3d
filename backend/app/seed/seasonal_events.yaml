# Datas que puxam vendas de modelos 3D, por país. Ver docs/hype-sazonal.md.
#
# countries: lista de códigos (app.constants.COUNTRIES) ou [ALL].
# rule (uma destas):
#   fixed: "MM-DD"
#   nth_weekday: {month, weekday (0=segunda … 6=domingo), n (1 = primeiro, -1 = último)}
#   easter_offset: dias em relação à Páscoa (0 = domingo de Páscoa)
#   after_nth_weekday: {month, weekday, n, plus_days}  (ex.: Black Friday)
# themes: ideias de modelos que costumam vender na data.

- slug: halloween
  name: Halloween
  countries: [ALL]
  rule: {fixed: "10-31"}
  themes: [abóboras, caveiras, bruxas, monstros clássicos, decoração de terror]

- slug: natal
  name: Natal
  countries: [ALL]
  rule: {fixed: "12-25"}
  themes: [enfeites de árvore, presépio, Papai Noel, porta-velas, presentes personalizados]

- slug: pascoa
  name: Páscoa
  countries: [ALL]
  rule: {easter_offset: 0}
  themes: [coelhos, porta-ovos, cestas, moldes de chocolate]

- slug: black_friday
  name: Black Friday
  countries: [ALL]
  rule: {after_nth_weekday: {month: 11, weekday: 3, n: 4, plus_days: 1}}
  themes: [pacotes de modelos, coleções com desconto, itens de presente]

