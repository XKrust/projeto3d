# Plataformas de venda. Ver docs/plataformas.md.
#
# sells: false = a loja fechou ou migrou; o site continua útil como sinal de tendência
#   (curtidas/visualizações), mas nunca é recomendado para vender.
# strength: força de VENDA no país (0–1). Estimativa baseada em pesquisa (fontes em
#   notes), editável em /config. Não depende de o app conseguir coletar a loja.
# categories: tipos de tema em que a loja é mais forte. Vazio = generalista (vale 1 para
#   tudo); senão, tema fora da lista vale 0.7.
# fee_pct: só preenchido quando confirmado na página oficial (URL em notes); senão null.
# Plataforma editada em /config não é mais sobrescrita por este arquivo.

